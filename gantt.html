<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOON — Diagrama de Gantt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0A192F;color:#e2e8f0;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:22px}

.head{text-align:center;margin-bottom:18px}
.head h1{font-size:23px;font-weight:700;color:#fff}
.head p{color:#94a3b8;font-size:13px;margin-top:5px}

.ctrl{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.ctrl button{background:#132241;border:1px solid #1e3a5f;color:#cbd5e1;padding:8px 15px;border-radius:9px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:600;transition:all .15s}
.ctrl button:hover{border-color:#007BFF;color:#fff}
.ctrl button.on{background:#007BFF;border-color:#007BFF;color:#fff}

/* ══ RESUMEN ══ */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.rc{background:#0f1d33;border:1px solid #1e3a5f;border-radius:12px;padding:13px 15px}
.rc .n{font-size:22px;font-weight:700;color:#52D8A1;line-height:1.1}
.rc .n.ro{color:#ef4444}.rc .n.az{color:#38bdf8}.rc .n.am{color:#f59e0b}
.rc .l{font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.rc .d{font-size:11.5px;color:#94a3b8;margin-top:5px}

/* ══ GANTT ══ */
.gantt{background:#0f1d33;border:1px solid #1e3a5f;border-radius:15px;padding:0;overflow:hidden}
.gwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1050px}
th,td{padding:0;font-size:12.5px}

/* Columna izquierda fija */
.col-nom{position:sticky;left:0;background:#0f1d33;z-index:3;border-right:2px solid #1e3a5f;min-width:230px;text-align:left}
.gwrap th.col-nom,.gwrap td.col-nom{padding:9px 13px}

thead th{background:#0c1829;color:#94a3b8;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;padding:11px 7px;border-bottom:2px solid #1e3a5f;position:sticky;top:0;z-index:4;text-align:center}
thead th.col-nom{text-align:left;z-index:5}

/* Cabecera de meses */
.meses th{background:#0a1424;font-size:10.5px;color:#64748b;padding:6px 4px;border-bottom:1px solid #1a2f4d;text-align:center;letter-spacing:.5px}

/* Filas de fase */
tr.fase{background:#12203a}
tr.fase td{border-bottom:1px solid #1e3a5f;padding:11px 0}
tr.fase .fn{font-weight:700;color:#fff;font-size:13px}
tr.fase .fs{font-size:10.5px;color:#64748b;margin-top:2px}
tr.fase .col-nom{cursor:pointer}
tr.fase .col-nom:hover{background:#16305a}

/* Filas de tarea */
tr.tar td{border-bottom:1px solid #16263f;padding:6px 0}
tr.tar:hover td{background:#12203a}
tr.tar .col-nom{padding-left:28px;font-size:12px;color:#94a3b8}
tr.tar .tid{font-family:'Courier New',monospace;font-size:10.5px;color:#64748b;margin-right:7px}
tr.tar.hecho .col-nom{color:#52D8A1}
tr.tar.user .col-nom{color:#fca5a5}

/* Celdas de barra */
td.barra{position:relative;height:26px;padding:0}

/* LA BARRA */
.b{position:absolute;height:15px;top:50%;transform:translateY(-50%);border-radius:5px;transition:all .2s;cursor:pointer}
.b:hover{filter:brightness(1.25);box-shadow:0 0 13px rgba(255,255,255,.25)}
.b.fase{height:20px;border-radius:7px;font-size:10.5px;color:#fff;font-weight:700;display:flex;align-items:center;padding:0 9px;white-space:nowrap;overflow:hidden}

/* Colores por estado */
.b.hecho{background:linear-gradient(90deg,#059669,#10b981)}
.b.activo{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.b.retraso{background:linear-gradient(90deg,#dc2626,#ef4444)}
.b.bloq{background:#334155}
.b.pend{background:#475569}
.b.user{background:linear-gradient(90deg,#b91c1c,#ef4444)}

/* Barra de progreso interno */
.b .prog{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.32);border-radius:5px}

/* Hoy */
.hoy{position:absolute;top:0;bottom:0;width:2px;background:#fbbf24;z-index:2;pointer-events:none}
.hoy::before{content:'HOY';position:absolute;top:-1px;left:3px;font-size:8.5px;color:#fbbf24;font-weight:700;letter-spacing:.4px}

/* Hitos */
.hito{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:13px;height:13px;background:#fbbf24;border:2px solid #0f1d33;z-index:2}

/* Leyenda */
.leyenda{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:11.5px}
.leyenda span{display:flex;align-items:center;gap:6px;color:#94a3b8}
.leyenda .d{width:14px;height:9px;border-radius:3px}

/* Detalle */
.detalle{background:#fff;color:#1e293b;border-radius:15px;padding:20px;margin-top:18px;display:none;animation:ap .2s ease}
.detalle.show{display:block}
@keyframes ap{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #e2e8f0}
.dh h2{font-size:18px;font-weight:700;color:#0f172a;flex:1}
.dh p{font-size:12.5px;color:#64748b;margin-top:3px}
.dx{background:#f1f5f9;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:#64748b;font-weight:700}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:720px){.dg{grid-template-columns:1fr}}
.bk{background:#f8fafc;border-radius:10px;padding:13px}
.bk h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#64748b;margin-bottom:7px;font-weight:700}
.bk p{font-size:13px;color:#334155;line-height:1.6}
.bk.az{border-left:4px solid #007BFF}
.bk.ro{background:#fee2e2}.bk.ro h3{color:#991b1b}
.bk.am{background:#fef3c7}.bk.am h3{color:#92400e}
.num{font-size:26px;font-weight:700;line-height:1.1}
.num.ok{color:#059669}.num.mal{color:#dc2626}.num.warn{color:#d97706}

.foot{text-align:center;color:#64748b;font-size:11px;margin-top:22px;padding-top:14px;border-top:1px solid #1e3a5f}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>📅 SOON — Diagrama de Gantt</h1>
    <p>28 semanas · 8 fases · 92 tareas · haz clic en una fase para ver su situación real</p>
  </div>

  <div class="ctrl">

  <div class="detalle" id="detalle"></div>

<script>
/*__DATOS_INICIO__*/var DATOS = {"meta":{"proyecto":"SOON","version":"1.0","fecha":"2026-09-18","fuente":"E-RL-004-SLT cronograma nivel 3 v1.1","total_tareas":92,"completadas":5,"hoy":"2026-09-18","fases":{"F0":{"nombre":"Definicion y base","semanas":4,"inicio":"2026-09-22","fin":"2026-10-16","hito":"M1","tareas":18},"F1":{"nombre":"Identidad","semanas":3,"inicio":"2026-10-19","fin":"2026-11-06","hito":"M2","tareas":12},"F2":{"nombre":"Marketplace","semanas":4,"inicio":"2026-11-09","fin":"2026-12-04","hito":"M3","tareas":14},"F3":{"nombre":"Ejecucion","semanas":5,"inicio":"2026-12-07","fin":"2027-01-08","hito":"M4","tareas":16},"F4":{"nombre":"Pagos y admin","semanas":3,"inicio":"2027-01-11","fin":"2027-01-29","hito":"M5","tareas":10},"F5":{"nombre":"Beta Android","semanas":3,"inicio":"2027-02-01","fin":"2027-02-19","hito":"M6","tareas":8},"F6":{"nombre":"Piloto Android","semanas":2,"inicio":"2027-02-22","fin":"2027-03-05","hito":"M7","tareas":6},"F7":{"nombre":"iOS","semanas":4,"inicio":"2027-03-08","fin":"2027-04-02","hito":"M8","tareas":8}},"actualizado":"2026-09-18"},"nodos":[{"id":"api","nombre":"API /api/v1","sub":"NestJS + Fastify · monolito modular","icono":"⚙️","capa":"nucleo","estado":"hecho","porque":"Es el pegamento del sistema: conecta la app móvil con la base de datos, los servicios externos y el dominio compartido. Se eligió monolito modular en vez de 9 microservicios porque una sola persona no puede operar 9 servicios: da la misma separación de responsabilidades sin la complejidad operativa.","conecta":["App móvil","PostgreSQL + PostGIS","Máquina de Estados","Contratos","Panel Admin"],"tareas":["F0-01","F0-02","F0-03","F0-04","F0-05","F0-06","F0-15"],"prueba":{"titulo":"Probado el 18 de septiembre de 2026","items":["Turborepo compiló los 3 paquetes en orden de dependencia en 8,79 s sin errores","El servidor arrancó en menos de 1 s y respondió en localhost:3000/api/v1","Los 5 endpoints responden HTTP 200","El CI quedó configurado con 3 jobs: verificación, auditoría de seguridad, prueba de arranque"]}},{"id":"viajes","nombre":"Viajes","sub":"dominio central del negocio","icono":"🚚","capa":"modulo","estado":"hecho","porque":"El viaje es el corazón de SOON: es lo que se publica, se oferta, se adjudica, se ejecuta y se liquida. Todo el negocio gira alrededor de esta entidad. Si no funciona el viaje, no hay producto.","conecta":["Máquina de Estados","PostgreSQL + PostGIS","Geo"],"tareas":["F2-01","F2-02","F2-03","F2-04","F2-05","F2-06","F2-08","F2-10","F2-11","F2-12"],"prueba":{"titulo":"Probado el 18 de septiembre de 2026","items":["5 endpoints funcionando: listar, buscar por id, resumen, transiciones y cambio de estado","El resumen calcula la comisión: Bs 2.670 sobre Bs 26.700","Cambio de estado exitoso: el viaje #2 pasó de adjudicado a en_transito","Ruta inválida devuelve HTTP 404 correctamente"]}},{"id":"fsm","nombre":"Máquina de Estados","sub":"@soon/domain · corre en servidor Y en celular","icono":"🔄","capa":"dominio","estado":"hecho","porque":"Las rutas Bolivia→Brasil tienen tramos de horas sin señal. Si el servidor fuera la única fuente de verdad, el viaje se detendría justo donde más importa. Al vivir en un paquete compartido (@soon/domain), la misma máquina corre en el celular del chofer y en el servidor: el chofer puede avanzar el estado sin conexión, y cuando recupera señal sincroniza.","conecta":["API /api/v1","App móvil","Offline-first"],"tareas":["F3-01","F3-02","F3-03","F3-04"],"prueba":{"titulo":"La prueba más importante del 18 de septiembre de 2026","items":["Chofer sobre viaje publicado devolvió 0 transiciones — correcto: todavía no puede actuar","Chofer sobre viaje adjudicado devolvió 1 transición: en_transito","Chofer intentó liquidado desde en_transito y el sistema lo RECHAZÓ con HTTP 400"],"nota":"La regla vive en el dominio compartido, no en el controlador. Por eso puede ejecutarse igual en el dispositivo del chofer."}},{"id":"offline","nombre":"Offline-first","sub":"outbox + idempotencia + conflictos","icono":"📴","capa":"dominio","estado":"curso","porque":"Sin esto, el chofer en zona sin señal no puede cambiar estados, ni registrar incidencias, ni tomar el POD: el viaje se congela. Una cola de GPS sola no alcanza. Lo que hay que resolver es qué pasa cuando dos actores modifican el mismo viaje sin conexión. Regla: el admin gana en estados administrativos, el chofer en los operativos de su viaje, y todo conflicto se registra en auditoría.","conecta":["Máquina de Estados","PostgreSQL + PostGIS","Tracking"],"tareas":["F3-05","F3-06","F3-07","F3-08","F3-09","F0-12"],"prueba":{"titulo":"Idempotencia ya probada el 18 de septiembre de 2026","items":["Se envió dos veces la misma transición con el mismo clientTransitionId","La segunda NO duplicó la operación"],"nota":"Eso significa que el chofer sin señal puede reintentar sin miedo a duplicar el cambio de estado."}},{"id":"auth","nombre":"Auth","sub":"OTP + permisos + multiempresa","icono":"🔐","capa":"modulo","estado":"pend","porque":"Sin autenticación no se sabe quién es quién. Y sin control de permisos, un transportista podría ver datos de otro. El aislamiento multiempresa es uno de los 3 riesgos más graves identificados en la revisión de arquitectura.","conecta":["Todos los módulos","App móvil","Panel Admin"],"tareas":["F1-01","F1-02","F1-03","F1-04","F1-05","F1-06","F1-07"],"extra":{"titulo":"Decisión tomada sobre el OTP","texto":"OTP por email primero (casi gratis), WhatsApp después, SMS último. El SMS a Bolivia cuesta US$0,2215 por segmento. Con 500 transportistas serían unos US$220 al mes: más que todo el presupuesto de infraestructura del piloto.","color":"azul"}},{"id":"tracking","nombre":"Tracking","sub":"GPS tiempo real · offline-capaz","icono":"📡","capa":"modulo","estado":"pend","porque":"La trazabilidad es la propuesta de valor frente a los transportistas tradicionales que operan por WhatsApp y llamadas. El cliente quiere ver dónde está su carga, y la prueba de entrega (POD) es la base de la liquidación.","conecta":["PostgreSQL + PostGIS","Google Maps","Offline-first"],"tareas":["F3-10","F3-11","F3-12","F3-13","F3-14","F3-15","F3-16"]},{"id":"pagos","nombre":"Pagos","sub":"liquidación semiautomática","icono":"💳","capa":"modulo","estado":"pend","porque":"El dinero es la razón por la que el transportista usa la plataforma. Pero el split automático salió del MVP: ningún PSP boliviano lo confirmó y era el riesgo crítico del proyecto. En su lugar: liquidación semiautomática con conciliación manual asistida.","conecta":["PSP boliviano","Viajes","Panel Admin"],"tareas":["F4-01","F4-02","F4-03","F4-04","F4-05","F4-06"]},{"id":"geo","nombre":"Geo","sub":"PostGIS aislado en su propio módulo","icono":"🗺️","capa":"modulo","estado":"pend","porque":"El producto tiene 6 consultas geoespaciales inherentes: camiones cerca del origen, matching flete-vehículo, cotización por ruta, tracking, alertas de desvío y cobertura por zona. Sin PostGIS esto se hace con bounding box en columnas numéricas: funciona con 100 vehículos y colapsa con 2.000, que es la meta del año uno.","conecta":["PostgreSQL + PostGIS","Viajes","Tracking"],"tareas":["F2-07","F2-09"],"extra":{"titulo":"Por qué va aislado","texto":"Prisma no soporta PostGIS nativamente: se usa SQL crudo ($queryRaw). Por eso TODAS las consultas geoespaciales viven en un módulo propio. Si algún día se cambia el ORM, el negocio no se toca.","color":"amarillo"}},{"id":"health","nombre":"Health","sub":"salud del servicio","icono":"💚","capa":"modulo","estado":"hecho","porque":"Es lo que consulta el balanceador de carga y el CI para saber si el sistema está vivo. Sin esto no se puede monitorear ni desplegar con seguridad.","conecta":["API /api/v1"],"tareas":["F0-05"],"prueba":{"titulo":"Probado el 18 de septiembre de 2026","items":["Endpoint de salud respondiendo HTTP 200","Verificado automáticamente en el job de arranque del CI"]}},{"id":"contracts","nombre":"Contratos","sub":"@soon/contracts · DTOs compartidos","icono":"📋","capa":"dominio","estado":"hecho","porque":"Si el backend cambia un campo y la app no, la app se rompe en producción. Al compartir los tipos, TypeScript avisa del desajuste antes de compilar. Esto es lo que evita lo que el ADR-001 llama duplicar contratos entre API y móvil.","conecta":["API /api/v1","App móvil","Panel Admin","Adaptadores"],"tareas":["F0-09","F0-10"],"prueba":{"titulo":"Base funcionando el 18 de septiembre de 2026","items":["ViajeDTO, CambiarEstadoDTO, TransicionDTO, HealthDTO y ErrorDTO ya definidos y en uso por la API"]}},{"id":"prisma","nombre":"Prisma","sub":"ORM · 16 modelos · 408 líneas","icono":"🔷","capa":"datos","estado":"pend","porque":"El esquema de datos es la forma del negocio. Ya existe uno de 16 modelos (User, Company, Vehicle, Trip, TripBid, Payment, POD...) escrito en el esqueleto anterior: es válido y se reutiliza.","conecta":["PostgreSQL + PostGIS","API /api/v1"],"tareas":["F0-08"]},{"id":"db","nombre":"PostgreSQL + PostGIS","sub":"datos transaccionales + geografía","icono":"🗄️","capa":"datos","estado":"user","porque":"Es donde vive todo: usuarios, viajes, ofertas, pagos, documentos. PostgreSQL porque es transaccional y auditable. PostGIS porque el producto es intrínsecamente geográfico.","conecta":["Prisma","Geo","Todos los módulos"],"tareas":["F0-07","F0-08","F0-11"],"extra":{"titulo":"Bloqueador actual","texto":"Requiere Docker Desktop instalado, que todavía no está. Alternativa: PostgreSQL nativo en Windows.","color":"rojo"}},{"id":"app","nombre":"App Móvil Multirol","sub":"React Native + Expo · una app, tres roles","icono":"📱","capa":"cliente","estado":"pend","porque":"Es el producto. Sin app no hay marketplace. Es una sola app con roles (Cliente / Transportista-Chofer), no tres apps separadas. Con una persona a 3-4 h por día, mantener 3 apps implicaría 3 fichas de tienda, 3 pipelines y 3 ciclos de actualización. Ahorra 3-4 semanas y hace que iOS reutilice toda la base.","conecta":["API /api/v1","Máquina de Estados","Contratos","Firebase FC <script>

//  MOTOR

var HOY = new Date(DATOS.meta.hoy + 'T00:00:00');
var FACTOR = 1.4, FINDE = 1.4;
var INICIO = new Date(DATOS.meta.fases.F0.inicio + 'T00:00:00');
var FIN    = new Date(DATOS.meta.fases.F7.fin + 'T00:00:00');
var DIAS_TOTAL = Math.round((FIN - INICIO) / 86400000);

var verTareasOn = false, modoActual = 'todo';

function fecha(s){ return new Date(s + 'T00:00:00'); }
function dias(a,b){ return Math.round((b-a)/86400000); }
function pct(d){ return (d / DIAS_TOTAL) * 100; }

function esfuerzoFase(f){
  var total = 0, hecho = 0;
  for (var id in DATOS.tareas){
    var t = DATOS.tareas[id];
    if (t.fase !== f) continue;
    total += (t.dias || 0);
    if (t.estado === 'hecho') hecho += (t.dias || 0);
  }
  return {total: total, hecho: hecho, resta: total - hecho};
}
function veredictoFase(f){
  var e = esfuerzoFase(f);
  var queda = dias(HOY, fecha(DATOS.meta.fases[f].fin));
  var necesita = Math.ceil(e.resta * FACTOR * FINDE);
  return {esfuerzo: e, queda: queda, necesita: necesita, holgura: queda - necesita};
}
function desbloqueada(id){
  var t = DATOS.tareas[id];
  if (!t || t.estado === 'hecho') return false;
  if (!t.depende || !t.depende.length) return true;
  for (var i = 0; i < t.depende.length; i++){
    var dt = DATOS.tareas[t.depende[i]];
    if (dt && dt.estado !== 'hecho') return false;
  }
  return true;
}
function clasificar(id){
  var t = DATOS.tareas[id];
  if (!t) return null;
  if (t.estado === 'hecho') return 'hecho';
  if (t.estado === 'user')  return 'user';
  if (!desbloqueada(id)) return 'bloq';
  return veredictoFase(t.fase).holgura < 0 ? 'retraso' : 'activo';
}

// Fechas reales de cada fase
function fechasFase(f){
  var fas = DATOS.meta.fases[f];
  return {ini: fecha(fas.inicio), fin: fecha(fas.fin), dur: dias(fecha(fas.inicio), fecha(fas.fin))};
}

// ══════════════════════════════════════════════════════════
//  RESUMEN
// ══════════════════════════════════════════════════════════
function pintaResumen(){
  var hechas = 0, tot = 0, act = 0, ret = 0, usr = 0;
  for (var id in DATOS.tareas){
    tot++;
    var c = clasificar(id);
    if (c === 'hecho') hechas++;
    if (c === 'activo') act++;
    if (c === 'retraso') ret++;
    if (c === 'user') usr++;
  }
  var fc = 'F0', v = veredictoFase('F0');

  document.getElementById('res').innerHTML =
    '<div class="rc"><div class="n">' + hechas + ' / ' + tot + '</div><div class="l">tareas completadas</div>' +
      '<div class="d">' + Math.round(hechas/tot*100) + '% del total</div></div>' +
    '<div class="rc"><div class="n az">' + act + '</div><div class="l">desbloqueadas ahora</div>' +
      '<div class="d">se pueden trabajar hoy</div></div>' +
    '<div class="rc"><div class="n ro">' + ret + '</div><div class="l">urgentes</div>' +
      '<div class="d">la fase no alcanza</div></div>' +
    '<div class="rc"><div class="n am">' + usr + '</div><div class="l">esperan tu acción</div>' +
      '<div class="d">no son programación</div></div>' +
    '<div class="rc"><div class="n ' + (v.holgura < 0 ? 'ro' : 'ok') + '">' +
      (v.holgura < 0 ? v.holgura : '+' + v.holgura) + ' d</div>' +
      '<div class="l">margen de Fase 0</div>' +
      '<div class="d">' + (v.holgura < 0 ? 'no alcanza al hito' : 'alcanza con margen') + '</div></div>';
}

// ══════════════════════════════════════════════════════════
//  GANTT
// ══════════════════════════════════════════════════════════
function pintaGantt(){
  var h = '<table>';

  // ── Cabecera de meses ──
  h += '<thead><tr class="meses"><th class="col-nom">Fase / Tarea</th>';
  var m = new Date(INICIO.getTime()); m.setDate(1);
  while (m <= FIN){
    var finMes = new Date(m.getFullYear(), m.getMonth()+1, 1);
    var a = m < INICIO ? INICIO : m;
    var b = finMes > FIN ? FIN : finMes;
    var w = pct(dias(a,b));
    var nom = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][m.getMonth()];
    var yr = String(m.getFullYear()).slice(2);
    if (w > 0) h += '<th colspan="1" style="width:' + w + '%">' + nom + ' ' + yr + '</th>';
    m = finMes;
  }
  h += '</tr></thead><tbody>';

  // ── Filas por fase ──
  for (var f in DATOS.meta.fases){
    if (modoActual === 'fase0' && f !== 'F0') continue;
    var fas = DATOS.meta.fases[f];
    var ff = fechasFase(f);
    var v = veredictoFase(f);
    var e = esfuerzoFase(f);
    var pctAv = e.total ? Math.round(e.hecho / e.total * 100) : 0;
    var clF = v.holgura < 0 ? 'retraso' : (pctAv === 100 ? 'hecho' : (pctAv > 0 ? 'activo' : 'pend'));

    var izq = pct(dias(INICIO, ff.ini));
    var anc = pct(ff.dur);

    h += '<tr class="fase">';
    h += '<td class="col-nom" onclick="verFase(\'' + f + '\')">' +
         '<div class="fn">' + f + ' · ' + fas.nombre + '</div>' +
         '<div class="fs">hito ' + fas.hito + ' · ' + fas.semanas + ' sem · ' + pctAv + '%</div></td>';
    h += '<td class="barra">';
    h += '<div class="b fase ' + clF + '" style="left:' + izq + '%;width:' + anc + '%" ' +
         'onclick="verFase(\'' + f + '\')" title="' + fas.nombre + '">';
    if (pctAv > 0) h += '<div class="prog" style="width:' + pctAv + '%"></div>';
    h += '<span style="position:relative">' + f + '</span></div>';
    h += '<div class="hito" style="left:' + pct(dias(INICIO, ff.fin)) + '%" title="' + fas.hito + '"></div>';
    h += '</td></tr>';

    // ── Tareas de la fase ──
    if (verTareasOn){
      for (var id in DATOS.tareas){
        var t = DATOS.tareas[id];
        if (t.fase !== f) continue;
        var c = clasificar(id);
        var pr = t.estado === 'hecho' ? 100 : (c === 'activo' ? 15 : 0);
        // Posicion dentro de la fase segun dependencias
        var pos = posTarea(id, f);
        h += '<tr class="tar ' + (t.estado === 'hecho' ? 'hecho' : (t.estado === 'user' ? 'user' : '')) + '">';
        h += '<td class="col-nom" onclick="verTarea(\'' + id + '\')">' +
             '<span class="tid">' + id + '</span>' + t.nombre + '</td>';
        h += '<td class="barra">';
        h += '<div class="b ' + c + '" style="left:' + pr_izq(pos, f) + '%;width:' + pr_anc(t, f) + '%" ' +
             'onclick="verTarea(\'' + id + '\')" title="' + t.nombre + '">';
        if (pr > 0) h += '<div class="prog" style="width:' + pr + '%"></div>';
        h += '</div></td></tr>';
      }
    }
  }

  h += '</tbody></table>';

  // Linea de HOY superpuesta
  var hh = '<div class="hoy" style="left:calc(230px + ' + pct(dias(INICIO, HOY)) + '% * (100% - 230px) / 100%)"></div>';
  document.getElementById('gwrap').innerHTML = h;

  // Insertar la linea de hoy en cada fila es costoso: se pone una sola guia global
  var gw = document.getElementById('gwrap');
  var linea = document.createElement('div');
  linea.style.cssText = 'position:absolute;top:0;bottom:0;width:2px;background:#fbbf24;z-index:2;pointer-events:none';
  document.querySelector('.gantt').style.position = 'relative';
}

// Posicion de una tarea dentro de su fase, segun orden de dependencia
function posTarea(id, f){
  var ids = Object.keys(DATOS.tareas).filter(function(k){ return DATOS.tareas[k].fase === f; });
  return ids.indexOf(id) / Math.max(ids.length, 1);
}
function pr_izq(pos, f){
  var ff = fechasFase(f);
  var izqFase = pct(dias(INICIO, ff.ini));
  return izqFase + pct(ff.dur) * pos * 0.92;
}
function pr_anc(t, f){
  var ff = fechasFase(f);
  var totalDias = esfuerzoFase(f).total || 1;
  return Math.max(pct(ff.dur) * ((t.dias || 1) / totalDias) * 0.92, 0.45);
}

// ══════════════════════════════════════════════════════════
//  DETALLE DE FASE
// ══════════════════════════════════════════════════════════
function verFase(f){
  var fas = DATOS.meta.fases[f];
  var v = veredictoFase(f);
  var e = esfuerzoFase(f);
  var pctAv = e.total ? Math.round(e.hecho / e.total * 100) : 0;

  var lista = Object.keys(DATOS.tareas).filter(function(k){ return DATOS.tareas[k].fase === f; });

  var h = '<div class="dh"><div style="flex:1"><h2>' + f + ' · ' + fas.nombre + '</h2>' +
          '<p>Hito ' + fas.hito + ' · ' + fas.semanas + ' semanas · del ' + fas.inicio + ' al ' + fas.fin + '</p></div>' +
          '<button class="dx" onclick="cerrar()">✕</button></div>';

  h += '<div class="dg"><div>';
  h += '<div class="bk ' + (v.holgura < 0 ? 'ro' : 'az') + '"><h3>¿Alcanza al hito?</h3>' +
       '<div class="num ' + (v.holgura < 0 ? 'mal' : 'ok') + '">' +
       (v.holgura < 0 ? v.holgura + ' días' : '+' + v.holgura + ' días') + '</div>' +
       '<p style="margin-top:8px">Quedan <b>' + v.queda + ' días</b> de calendario y falta trabajar ' +
       '<b>' + v.necesita + ' días</b> a 3-4 h por día, descontando fines de semana.<br><br>' +
       (v.holgura < 0
         ? 'No alcanza. Cada día que no avance aquí empuja todo lo que viene abajo.'
         : 'Alcanza. Hay margen para un imprevisto de ' + v.holgura + ' días.') + '</p></div>';
  h += '</div><div>';

  h += '<div class="bk"><h3>Esfuerzo</h3><p>' +
       '<b>' + e.hecho + '</b> de <b>' + e.total + '</b> días de trabajo completados (' + pctAv + '%).<br>' +
       'Quedan <b>' + e.resta + '</b> días de trabajo.</p>' +
       '<div style="height:8px;background:#e2e8f0;border-radius:4px;margin-top:10px;overflow:hidden">' +
       '<div style="height:100%;width:' + pctAv + '%;background:#059669"></div></div></div>';

  h += '<div class="bk am" style="margin-top:13px"><h3>Tareas de esta fase</h3><p style="font-size:12.5px">' +
       lista.length + ' tareas: ' +
       lista.filter(function(k){ return DATOS.tareas[k].estado === 'hecho'; }).length + ' hechas, ' +
       lista.filter(function(k){ return clasificar(k) === 'activo'; }).length + ' desbloqueadas, ' +
       lista.filter(function(k){ return clasificar(k) === 'retraso'; }).length + ' urgentes.</p></div>';

  h += '</div></div>';

  document.getElementById('detalle').innerHTML = h;
  document.getElementById('detalle').classList.add('show');
  document.getElementById('detalle').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function verTarea(id){
  var t = DATOS.tareas[id];
  var c = clasificar(id);
  var v = veredictoFase(t.fase);
  var nom = {hecho:'COMPLETADA', activo:'SE PUEDE TRABAJAR', retraso:'URGENTE', bloq:'BLOQUEADA', user:'ESPERA TU ACCION'}[c];

  var h = '<div class="dh"><div style="flex:1"><h2>' + id + ' · ' + t.nombre + '</h2>' +
          '<p>' + nom + ' · Fase ' + t.fase + ' · ' + (t.dias || 1) + ' día(s) de trabajo</p></div>' +
          '<button class="dx" onclick="cerrar()">✕</button></div>';
  h += '<div class="dg"><div><div class="bk az"><h3>Para qué sirve</h3><p>' + (t.porque || '') + '</p></div></div>';
  h += '<div><div class="bk"><h3>Depende de</h3><p>' +
       ((t.depende && t.depende.length) ? t.depende.join(', ') : 'Nada: puede empezar ya.') + '</p></div>';
  if (t.entregable) h += '<div class="bk" style="margin-top:13px"><h3>Qué produce</h3><p>' + t.entregable + '</p></div>';
  h += '</div></div>';

  document.getElementById('detalle').innerHTML = h;
  document.getElementById('detalle').classList.add('show');
}

function cerrar(){ document.getElementById('detalle').classList.remove('show'); }

// ══════════════════════════════════════════════════════════
//  CONTROLES
// ══════════════════════════════════════════════════════════
function modo(m, btn){
  modoActual = m;
  document.querySelectorAll('.ctrl button').forEach(function(b){ if(b.textContent.indexOf('Fase')<0 && b.textContent.indexOf('tareas')<0 && b.textContent.indexOf('hoy')<0) b.classList.remove('on'); });
  btn.classList.add('on');
  pintaGantt();
}

function verTareas(btn){
  verTareasOn = !verTareasOn;
  btn.classList.toggle('on', verTareasOn);
  btn.textContent = verTareasOn ? 'Ocultar tareas' : 'Mostrar tareas';
  pintaGantt();
}

function irHoy(){
  var gw = document.getElementById('gwrap');
  var objetivo = 230 + (gw.scrollWidth - 230) * (pct(dias(INICIO, HOY)) / 100);
  gw.scrollTo({left: Math.max(0, objetivo - gw.clientWidth / 2), behavior:'smooth'});
}

// ══════════════════════════════════════════════════════════
document.getElementById('fhoy').textContent = DATOS.meta.hoy;
pintaResumen();
pintaGantt();
</script>
